<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatFree</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <h1 id="title">ChatFree</h1>
      <div id="header-controls">
        <select id="backend-select">
          <option value="deepseek">DeepSeek</option>
          <option value="chatgpt">ChatGPT</option>
          <option value="doubao">豆包 Doubao</option>
        </select>
        <div id="status-bar">
          <span id="status-dot"></span>
          <span id="status-text">Checking...</span>
        </div>
        <button id="debug-toggle" title="Toggle debug panel">DBG</button>
      </div>
    </header>

    <div id="main-area">
      <div id="embed-area" class="hidden"></div>

      <aside id="debug-panel" class="hidden">
        <div id="debug-header">
          <span id="debug-title">Debug Log</span>
          <button id="debug-clear" title="Clear log">Clear</button>
        </div>
        <div id="debug-log"></div>
      </aside>
    </div>

    <footer id="input-area"></footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
