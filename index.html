<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatFree</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="vendor/highlight-theme.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <h1 id="title">ChatFree</h1>
      <div id="header-controls">
        <select id="module-select" title="Sync mode">
          <option value="embed">Embed</option>
          <option value="text">Text Sync</option>
        </select>
        <select id="backend-select">
          <option value="deepseek">DeepSeek</option>
          <option value="chatgpt">ChatGPT</option>
          <option value="doubao">豆包 Doubao</option>
        </select>
        <div id="status-bar">
          <span id="status-dot"></span>
          <span id="status-text">Checking...</span>
        </div>
        <button id="debug-toggle" title="Toggle debug panel">DBG</button>
      </div>
    </header>

    <div id="main-area">
      <!-- Embed sync: iframe container (first so ~ selector works) -->
      <div id="embed-area" class="hidden"></div>

      <!-- Text sync: chat messages area -->
      <div id="chat-area">
        <div id="messages"></div>
        <div id="typing-indicator" class="hidden">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>

      <aside id="debug-panel" class="hidden">
        <div id="debug-header">
          <span id="debug-title">Debug Log</span>
          <button id="debug-clear" title="Clear log">Clear</button>
        </div>
        <div id="debug-log"></div>
      </aside>
    </div>

    <footer id="input-area">
      <textarea id="message-input" placeholder="Type a message..." rows="2" disabled></textarea>
      <button id="send-btn" disabled>Send</button>
      <button id="sync-btn" title="Sync/Reload the backend view">Sync</button>
      <button id="test-btn" title="Test connection">Test</button>
    </footer>
  </div>

  <script src="vendor/marked.umd.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
