<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatFree</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <section id="input-area"></section>

    <aside id="debug-panel" class="hidden">
      <div id="debug-header">
        <span id="debug-title">Debug Log</span>
        <div id="debug-header-actions">
          <button id="debug-copy" title="Copy log">Copy</button>
          <button id="debug-clear" title="Clear log">Clear</button>
        </div>
      </div>
      <div id="debug-log"></div>
    </aside>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
