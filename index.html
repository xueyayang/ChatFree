<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatFree</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <h1 id="title">ChatFree</h1>
      <div id="header-controls">
        <div id="site-icons">
          <button class="site-icon" draggable="true" data-site="deepseek" title="DeepSeek">
            <img src="icons/deepseek.png" alt="DS" />
          </button>
          <button class="site-icon" draggable="true" data-site="chatgpt" title="ChatGPT">
            <img src="icons/chatgpt.png" alt="GPT" />
          </button>
          <button class="site-icon" draggable="true" data-site="doubao" title="豆包">
            <img src="icons/doubao.png" alt="DB" />
          </button>
          <button class="site-icon" draggable="true" data-site="qianwen" title="千问">
            <img src="icons/qianwen.png" alt="QW" />
          </button>
          <button class="site-icon" draggable="true" data-site="gemini" title="Gemini">
            <img src="icons/gemini.png" alt="GM" />
          </button>
        </div>
      </div>
      <button id="debug-toggle" title="Toggle debug panel">DBG</button>
    </header>

    <section id="input-area"></section>

    <aside id="debug-panel" class="hidden">
      <div id="debug-header">
        <span id="debug-title">Debug Log</span>
        <div id="debug-header-actions">
          <button id="debug-copy" title="Copy log">Copy</button>
          <button id="debug-clear" title="Clear log">Clear</button>
        </div>
      </div>
      <div id="debug-log"></div>
    </aside>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
