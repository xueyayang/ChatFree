<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatFree</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <h1 id="title">ChatFree</h1>
      <div id="header-controls">
        <div id="site-icons">
          <button class="site-icon" draggable="true" data-site="deepseek" title="DeepSeek">
            <img src="https://www.google.com/s2/favicons?domain=chat.deepseek.com&sz=32" alt="DS" />
          </button>
          <button class="site-icon" draggable="true" data-site="chatgpt" title="ChatGPT">
            <img src="https://www.google.com/s2/favicons?domain=chatgpt.com&sz=32" alt="GPT" />
          </button>
          <button class="site-icon" draggable="true" data-site="doubao" title="豆包">
            <img src="https://www.google.com/s2/favicons?domain=www.doubao.com&sz=32" alt="DB" />
          </button>
        </div>
        <button id="debug-toggle" title="Toggle debug panel">DBG</button>
      </div>
    </header>

    <div id="main-area">
      <div id="indicator-strip">
        <div id="indicator-left" class="panel-indicator" data-side="left"></div>
        <div id="indicator-right" class="panel-indicator" data-side="right"></div>
      </div>
      <div id="embed-panel-left" class="embed-panel hidden"></div>
      <div id="resize-gutter" class="hidden"></div>
      <div id="embed-panel-right" class="embed-panel hidden"></div>
      <div id="panel-switch" class="hidden">
        <div class="switch-side left" data-side="left"></div>
        <div class="switch-side right" data-side="right"></div>
      </div>

      <aside id="debug-panel" class="hidden">
        <div id="debug-header">
          <span id="debug-title">Debug Log</span>
          <div id="debug-header-actions">
            <button id="test-btn" title="Ping iframe → content script diagnose → background connectivity fetch. To test other things, replace runDiagnostics() in app.js.">Test</button>
            <button id="debug-copy" title="Copy log">Copy</button>
            <button id="debug-clear" title="Clear log">Clear</button>
          </div>
        </div>
        <div id="debug-log"></div>
      </aside>
    </div>

    <footer id="input-area"></footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
